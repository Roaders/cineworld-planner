name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 26.x
      uses: actions/setup-node@v7
      with:
        node-version: 26.x
        cache: npm
    - run: npm ci
    - run: npm run verify-release
