
<div class="date-selector">

  <div class="btn-group btn-group-responsive" role="group" aria-label="Select Day">
    @for (day of days; track day) {
      <button
        type="button"
        class="btn btn-primary"
        [ngClass]="{active: isActive(day)}"
        (click)="selectDate(day)"
      >{{day.description}}</button>
    }
  </div>

</div>
